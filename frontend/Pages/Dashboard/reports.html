<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Intelligence Policing System</title>
    <link rel="stylesheet" href="../../Assets/CSS/styles.css">
    <link rel="stylesheet" href="../../Assets/CSS/layout.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>IPS</h2>
                <p>Intelligence Policing System</p>
            </div>
            <nav>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">
                            <span class="nav-icon">📊</span>
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="reports.html" class="nav-link active">
                            <span class="nav-icon">📋</span>
                            Reports
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="add-report.html" class="nav-link">
                            <span class="nav-icon">➕</span>
                            Add Report
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="suspects.html" class="nav-link">
                            <span class="nav-icon">👤</span>
                            Suspects
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="analytics.html" class="nav-link">
                            <span class="nav-icon">📈</span>
                            Analytics
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="settings.html" class="nav-link">
                            <span class="nav-icon">⚙️</span>
                            Settings
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div class="topbar-title">Analytics & Insights</div>
            
                <div class="topbar-user">
                    <div class="user-info">
                        <div class="user-name" id="userName">Loading...</div>
                        <div class="user-role" id="userRole">Senior Analyst</div>
                    </div>
                    <div class="user-avatar" id="userAvatar">--</div>
                    <button id="logoutBtn" class="logout-btn">Logout</button>
                </div>
            </div>

            <div class="content-area">
                <div class="page-header">
                    <div class="page-title">All Reports</div>
                    <div class="page-subtitle">List of all submitted intelligence reports</div>
                </div>

                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search reports by ID, location, or type">
                    <button class="btn btn-secondary" onclick="clearFilters()">Clear</button>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Report ID</th>
                                <th>Incident Type</th>
                                <th>Location</th>
                                <th>Date & Time</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reportsTable">
                            <!-- JS will populate reports here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../../Srcipts/reports.js"></script>
    <script src="../../Srcipts/auth-user.js"></script>
</body>

</html>
