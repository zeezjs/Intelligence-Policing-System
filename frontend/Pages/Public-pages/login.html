<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Intelligence Policing System</title>

    <link rel="stylesheet" href="../../Assets/CSS/styles.css">
    <link rel="stylesheet" href="../../Assets/CSS/login.css">
    <link rel="stylesheet" href="../../Assets/CSS/layout.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">IPS</div>
                <div class="login-subtitle">Intelligence Policing System</div>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email / Officer ID</label>
                    <input type="text" id="email" class="form-control" placeholder="Enter your email or ID" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
                <p class="account-form-text">Don't have an account? <a href="regsiter.html"
                        class="account-form-link">Register</a></p>
            </form>

            <div class="login-footer">
                Secure Access Only - Authorized Personnel
            </div>
        </div>
    </div>

    <!-- <script src="js/login.js"></script> -->
    <script src="../../Srcipts/auth.js"></script>
</body>

</html>
