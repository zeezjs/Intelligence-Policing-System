<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Intelligence Policing System</title>

    <link rel="stylesheet" href="../../Assets/CSS/styles.css">
    <link rel="stylesheet" href="../../Assets/CSS/login.css">
    <link rel="stylesheet" href="../../Assets/CSS/layout.css">
    <link rel="stylesheet" href="../../Assets/CSS/register.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">IPS</div>
                <div class="login-subtitle">Intelligence Policing System</div>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="full-name">Fullname</label>
                    <input type="text" id="full-name" class="form-control" placeholder="Enter ypur fullname" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email / Officer ID</label>
                    <input type="text" id="email" class="form-control" placeholder="Enter your email or ID" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" class="form-control"
                        placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="btn btn-primary">Register</button>
            </form>

            <div class="login-footer">
                Secure Access Only - Authorized Personnel
            </div>
        </div>
    </div>

    <!-- <script src="js/login.js"></script> -->
</body>

</html>
